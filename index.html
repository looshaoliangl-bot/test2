<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunch Lane – customer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F1;--card:#fff;--ink:#12303A;--mute:#5B7179;--line:#D5E1DD;--acc:#0E7C66;--acc-ink:#fff;--bell:#FFB703;--bad:#C8401F;--ok:#2E9E6B;--mid:#E0A100;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1C20;--card:#172A30;--ink:#E6F0EE;--mute:#9DB4B3;--line:#2A4249;--acc:#35C2A1;--acc-ink:#08231D;--bad:#FF7A59;--ok:#4CC98E;--mid:#FFC93C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1C20;--card:#172A30;--ink:#E6F0EE;--mute:#9DB4B3;--line:#2A4249;--acc:#35C2A1;--acc-ink:#08231D;--bad:#FF7A59;--ok:#4CC98E;--mid:#FFC93C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;margin:0;line-height:1.15}
.app{max-width:560px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.top h1{font-size:22px;font-weight:800}
.top small{color:var(--mute)}
.hero{background:var(--acc);color:var(--acc-ink);border-radius:20px;padding:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero .big{font:800 56px/1 'Bricolage Grotesque',sans-serif}
.hero p{margin:4px 0 0;opacity:.9}
.hero .best{background:var(--bell);color:#3a2a00;border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px;max-width:150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card h2{font-size:18px;margin-bottom:4px}
.sub{color:var(--mute);font-size:14px;margin:0 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.btn{font:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600;border-radius:12px;padding:12px 16px;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--bell);outline-offset:2px}
.stall{border-top:1px solid var(--line);padding:12px 0}
.stall:first-of-type{border-top:0}
.wait{font:700 20px 'Bricolage Grotesque',sans-serif;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0}
.tag{font-size:12px;background:var(--bell);color:#3a2a00;border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.status{border-radius:14px;padding:16px;margin-top:12px;background:var(--ink);color:var(--bg)}
.status.ready{background:var(--bell);color:#3a2a00}
.status h2{font-size:26px}
.bar{height:8px;border-radius:8px;background:rgba(127,127,127,.3);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;transition:width .6s}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px}
.chart div{flex:1;border-radius:6px 6px 0 0;background:var(--line);position:relative;min-height:6px}
.chart div.now{background:var(--acc)}
.chart div.best{background:var(--bell)}
.lbls{display:flex;gap:6px;font-size:11px;color:var(--mute)}
.lbls span{flex:1;text-align:center}
.seatgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.seat{aspect-ratio:1;border-radius:10px;border:2px solid var(--ok);background:transparent;color:var(--ink);font:inherit;font-size:12px;cursor:pointer}
.seat.taken{border-color:var(--line);background:var(--line);color:var(--mute);cursor:not-allowed}
.seat.mine{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.tl{display:flex;height:34px;border-radius:10px;overflow:hidden;margin:10px 0;font-size:12px;font-weight:600}
.tl span{display:flex;align-items:center;justify-content:center;color:#fff;white-space:nowrap;overflow:hidden}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav div{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:6px 2px;cursor:pointer;min-height:48px;border-radius:10px}
nav button[aria-selected=true]{color:var(--acc);font-weight:700}
nav svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);min-height:70px}
.res{display:grid;grid-template-columns:120px 1fr 28px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.res i{display:block;height:10px;border-radius:6px;background:var(--acc)}
.warn{color:var(--bad);font-weight:600}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
section[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.tag.pri{background:var(--bad);color:#fff}
.num{font:800 46px/1 'Bricolage Grotesque',sans-serif;margin:2px 0 8px}
.mode{display:flex;gap:6px}
.mode .chip{padding:6px 12px;min-height:36px;font-size:14px}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.cnt{display:flex;gap:8px;margin-top:12px}.cnt div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.cnt b{display:block;font:800 24px 'Bricolage Grotesque',sans-serif}
.oc.pri{border-left:5px solid var(--bad)}
.cm{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div class="app">
  <div class="top"><div><h1>Lunch Lane</h1><small id="sub">School food court</small></div></div>
  <div id="hero"></div>
  <main id="v"></main>
</div>
<nav aria-label="Main"><div role="tablist" id="nav"></div></nav>
<div class="toast" id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('ll:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ll:'+k,JSON.stringify(v))}catch(e){}}};
const STALLS=[
 {id:'chicken',name:'Chicken rice stall',base:9,items:[{n:'Roast chicken rice',p:4.5},{n:'Chicken rice, ready pack',p:4.0,ready:1}]},
 {id:'noodle',name:'Noodle bar',base:12,items:[{n:'Fishball noodles',p:3.8},{n:'Mee pok dry',p:4.2}]},
 {id:'western',name:'Western grill',base:14,items:[{n:'Chicken chop',p:5.5},{n:'Grilled fish & fries',p:5.8}]},
 {id:'mixed',name:'Ready meals counter',base:4,items:[{n:'Mixed rice, 2 veg 1 meat',p:3.5,ready:1},{n:'Curry rice, ready pack',p:3.8,ready:1}]}
];
const SLOTS=['11:45','12:00','12:10','12:20','12:30','12:40','12:50'];
const CROWD=[30,55,90,100,85,60,35];
const SURVEY0={'Long queues':18,'No seats':12,'Dirty tables':9,'Wrong orders':7,'Rude staff':4};
const PAYL={unpaid:'Not paid',claimed:'Customer says paid',counter:'Pay at counter',paid:'Paid'};
const INP='style="font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);width:100%"';
const NEXT={new:['preparing','Start preparing'],preparing:['ready','Mark ready'],ready:['collected','Mark collected']};
const ST={new:['Order sent','Waiting for the stall to accept it',25],preparing:['Preparing your food','The stall is cooking now',65],ready:['Ready!','',100]};
const TABS={customer:[['order','Order'],['wait','Wait times'],['feed','Feedback']],owner:[['oorders','Orders'],['ostalls','Settings'],['ofeed','Feedback']]};
const ICON={order:'<path d="M5 4h14l-1.5 11h-11z"/><path d="M5 4 4 2H2"/><circle cx="9" cy="19" r="1.2"/><circle cx="16" cy="19" r="1.2"/>',wait:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',feed:'<path d="M4 5h16v11H9l-5 4z"/>',oorders:'<path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6"/>',ostalls:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>',ofeed:'<path d="M4 5h16v11H9l-5 4z"/>'};
let S={mode:'customer',stall:null,locked:false,pending:null,pn:null,tab:'order',breakMin:store.get('break',60),cart:{},slot:'12:00',lane:'standard',mine:[].concat(store.get('mine',[])),seen:{},jit:{},canOwn:true,fb:{rate:0,tags:[],text:''},sent:false,method:'paynow',pl:null};
function route(){const h=location.hash;S.mode=h.startsWith('#owner')?'owner':'customer';const m=h.match(/^#owner-([a-z]+)$/);S.stall=m&&STALLS.some(x=>x.id===m[1])?m[1]:null}
S.mode='customer';

const ping=()=>{const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA/.test(a.tagName)))render()};
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)};

/* Shared data: live database when the page is shared with signed-in people, otherwise this device only */
const Sync={d:{orders:[],fb:[],cfg:[]},db:null,live:false,
 load(n){this.d[n]=store.get('c:'+n,[])},
 async init(){
  Object.keys(this.d).forEach(n=>this.load(n));
  try{const db=await claude.use('db');if(db){this.db=db;this.live=true;Object.keys(this.d).forEach(n=>db.collection(n).onSnapshot(s=>{if(!this.db)return;this.d[n]=s.docs.map(x=>({...x.data(),id:x.id}));ping()},()=>{}))}}catch(e){}
  try{const u=await claude.use('user');if(u&&!u.canEdit())S.locked=true}catch(e){}
  ping()},
 async put(n,o){
  if(this.db){try{await this.db.collection(n).doc(o.id).set(o);return}catch(e){this.db=null;this.live=false;toast('Live sync is off. Saved on this device only.')}}
  const a=this.d[n].filter(x=>x.id!==o.id);a.push(o);this.d[n]=a;store.set('c:'+n,a);ping()}
};
addEventListener('storage',()=>{if(!Sync.db){Object.keys(Sync.d).forEach(n=>Sync.load(n));ping()}});

const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+(m||0)};
const idx=()=>{const x=toMin(S.slot);let b=0;SLOTS.forEach((s,i)=>{if(Math.abs(toMin(s)-x)<Math.abs(toMin(SLOTS[b])-x))b=i});return b};
const crowdNow=()=>CROWD[idx()]/100;
const cfgOf=st=>Sync.d.cfg.find(x=>x.id===st.id);
const auto=st=>Math.max(2,Math.round(st.base*(0.4+crowdNow())+(S.jit[st.id]||0)));
const waitFor=st=>{const c=cfgOf(st);return c&&c.wait!=null?c.wait:auto(st)};
const col=w=>w<=6?'var(--ok)':w<=12?'var(--mid)':'var(--bad)';
const avgWait=()=>Math.round(STALLS.reduce((a,s)=>a+waitFor(s),0)/STALLS.length);
const fmt=n=>'$'+n.toFixed(2);
const survey=()=>{const s={...SURVEY0};Sync.d.fb.forEach(f=>(f.tags||[]).forEach(t=>s[t]=(s[t]||0)+1));return s};
const surveyHTML=()=>{const s=survey(),max=Math.max(...Object.values(s));return Object.entries(s).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="res"><span>${esc(k)}</span><i style="width:${v/max*100}%"></i><b>${v}</b></div>`).join('')};
function cartTotals(){let n=0,t=0;STALLS.forEach(s=>s.items.forEach(it=>{const q=S.cart[it.n]||0;if(q){n+=q;t+=q*it.p}}));return{n,t}}
const myOrder=()=>Sync.d.orders.find(x=>x.id===S.mine);
const syncNote=()=>`<p class="note">${Sync.live?'Live: orders and feedback sync between everyone who has this page open.':'Demo mode: orders and feedback stay on this device (open the owner link in another tab to see them).'}</p>`;

const tlv=(i,v)=>i+String(v.length).padStart(2,'0')+v;
const crc=t=>{let c=0xFFFF;for(let i=0;i<t.length;i++){c^=t.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')};
const payNowCfg=id=>{const c=Sync.d.cfg.find(x=>x.id==='paynow-'+id);return c&&c.proxy?c:null};
function payNowPayload(c,amt,ref){
 const acct=tlv('00','SG.PAYNOW')+tlv('01',c.type==='uen'?'2':'0')+tlv('02',c.proxy)+tlv('03','0');
 const p=tlv('00','01')+tlv('01','12')+tlv('26',acct)+tlv('52','0000')+tlv('53','702')+tlv('54',amt.toFixed(2))+tlv('58','SG')+tlv('59',(c.name||'Food court').slice(0,25))+tlv('60','Singapore')+tlv('62',tlv('01',ref))+'6304';
 return p+crc(p)}
function payCard(o){
 const m={paid:'Paid. Thank you.',claimed:'Paid by '+(ML[o.method]||'PayNow')+'. Waiting for the stall to confirm your payment.'}[o.pay];
 return m?`<div class="card"><h2>Payment</h2><p class="sub" style="margin:0">${esc(m)}</p></div>`:''}
const payLahCfg=id=>{const c=Sync.d.cfg.find(x=>x.id==='paylah-'+id);return c&&c.number?c:null};
const ML={paynow:'PayNow',paylah:'PayLah',demo:'demo payment'};
const methodsOf=p=>{const a=[];if(payNowCfg(p.stall))a.push('paynow');if(payLahCfg(p.stall))a.push('paylah');return a};
const methodOf=p=>{const a=methodsOf(p);return a.length?(a.includes(S.method)?S.method:a[0]):'demo'};
function checkout(p){
 const a=methodsOf(p),m=methodOf(p);let pay='';
 if(m==='paynow')pay=`<p class="sub">Scan with your banking app. The amount and reference #${esc(p.num)} are filled in.</p><div id="pnqr" style="background:#fff;border-radius:12px;padding:8px;width:fit-content;margin:0 auto"></div>`;
 else if(m==='paylah'){const num=payLahCfg(p.stall).number.replace(/^\+65(\d{4})(\d{4})$/,'+65 $1 $2');pay=`<p class="sub">Open DBS PayLah!, choose to pay a mobile number, and enter these details exactly.</p><div class="row stall"><span>PayLah number</span><b class="wait">${esc(num)}</b></div><div class="row stall"><span>Amount</span><b class="wait">${fmt(p.total)}</b></div><div class="row stall"><span>Message</span><b class="wait">Order #${esc(p.num)}</b></div>`}
 else pay=`<p class="sub">Demo mode: ${esc(p.stallName)} hasn’t set up PayNow or PayLah, so there is nothing real to pay. Tap below to pretend you paid.</p>`;
 return `<div class="card"><small>${esc(p.stallName)} · your order number</small><div class="num">#${esc(p.num)}</div><p class="sub">Pay first. Your order is sent to the stall after you pay.</p>${p.items.map(i=>`<div class="row"><span>${esc(i.q)} × ${esc(i.n)}</span></div>`).join('')}<div class="row" style="margin-top:10px"><b>Total</b><b class="wait">${fmt(p.total)}</b></div></div>
 <div class="card"><h2>${m==='demo'?'Payment':'Pay with '+ML[m]}</h2>${a.length>1?`<div class="chips" style="margin:8px 0">${a.map(x=>`<button class="chip" data-meth="${x}" aria-pressed="${m===x}">${ML[x]}</button>`).join('')}</div>`:''}${pay}<button class="btn" style="margin-top:12px" id="paid">${m==='demo'?'Simulate payment and send order':'I’ve paid – send my order'}</button><button class="btn ghost" style="margin-top:10px" id="backcart">Back to menu</button></div>`}
function drawQR(){const el=$('#pnqr'),o=S.pending,c=o&&payNowCfg(o.stall);if(!el||!o||!c)return;try{const q=qrcode(0,'M');q.addData(payNowPayload(c,+o.total,o.num));q.make();el.innerHTML=q.createSvgTag({cellSize:5,margin:1,scalable:true});const g=el.firstChild;g.style.width='220px';g.style.height='220px'}catch(e){el.textContent='Couldn’t draw the QR code. Try again or ask the stall.'}}
const stallOf=()=>STALLS.find(x=>x.id===S.stall);
const pl=()=>S.pl||(S.pl={raw:(payLahCfg(S.stall)||{}).raw||''});
const pn=()=>S.pn||(S.pn=(c=>({type:c.type||'mobile',raw:c.raw||'',name:c.name||''}))(payNowCfg(S.stall)||{}));
function renderOrder(){
  if(S.pending)return checkout(S.pending);
  const short=S.breakMin<=30;let h='';
  const mine=S.mine.map(id=>Sync.d.orders.find(x=>x.id===id)).filter(o=>o&&!['collected','cancelled'].includes(o.status)).sort((a,b)=>b.t-a.t);
  mine.forEach(o=>{const st=ST[o.status],ready=o.status==='ready',where=o.lane==='priority'?'priority pickup counter':'pre-order counter';
    h+=`<div class="status ${ready?'ready':''}" role="status" style="margin-top:12px"><small>${esc(o.stallName)} · your order number</small><div class="num">#${esc(o.num)}</div><h2>${st[0]}</h2><p style="margin:4px 0 0">${ready?`Collect at the ${where}. Show order #${esc(o.num)}.`:st[1]+' · '+(o.lane==='priority'?'Priority pickup':'Standard pickup')+' at '+esc(o.slot)}</p><div class="bar"><i style="width:${st[2]}%"></i></div></div>`;
    if(ready)h+=`<button class="btn ghost" style="margin-top:10px" data-got="${esc(o.id)}">I’ve collected order #${esc(o.num)}</button>`;
    h+=payCard(o)});
  h+=`<div class="card"><h2>Pre-order your lunch</h2><p class="sub">Each stall has its own order and payment. You can order from several stalls at the same time. Ready meals take about 1 minute.</p>
  <p class="sub" style="margin:0 0 6px">Pickup time: tap a time or type your own</p><div class="chips" style="margin-bottom:10px">${SLOTS.map(x=>`<button class="chip" data-s="${x}" aria-pressed="${S.slot===x}">${x}</button>`).join('')}</div>
  <label class="sub" for="pickup" style="display:block;margin-bottom:6px">Or type the exact time</label><input id="pickup" type="time" value="${S.slot}" min="11:30" max="13:30" ${INP}>
  <div class="chips" style="margin-top:10px"><button class="chip" data-l="standard" aria-pressed="${S.lane==='standard'}">Standard pickup</button><button class="chip" data-l="priority" ${short?'':'disabled style="opacity:.45"'} aria-pressed="${S.lane==='priority'}">Priority pickup (30-min breaks)</button></div>
  <p class="sub" style="margin:10px 0 6px">Your break length (priority pickup is for 30 minutes or less)</p><div class="chips">${[30,45,60].map(m=>`<button class="chip" data-b="${m}" aria-pressed="${S.breakMin===m}">${m} min</button>`).join('')}</div></div>`;
  STALLS.forEach(s=>{const w=waitFor(s);let n=0,t=0;s.items.forEach(it=>{const q=S.cart[it.n]||0;n+=q;t+=q*it.p});
    h+=`<div class="card"><div class="row"><h2>${s.name}</h2><span class="wait" style="color:${col(w)}">~${w} min</span></div>`;
    s.items.forEach(it=>{const q=S.cart[it.n]||0;h+=`<div class="item"><span>${it.n}${it.ready?'<span class="tag">Ready</span>':''}<br><small style="color:var(--mute)">${fmt(it.p)}</small></span><span class="qty"><button aria-label="Remove ${it.n}" data-m="${it.n}">−</button><b>${q}</b><button aria-label="Add ${it.n}" data-p="${it.n}">+</button></span></div>`});
    h+=`<button class="btn" style="margin-top:8px" data-place="${s.id}" ${n?'':'disabled'}>${n?`Pay and order · ${fmt(t)}`:'Add items to order'}</button></div>`});
  return h+syncNote()}

function renderWait(){
  let h=`<div class="card"><h2>Wait time before you queue</h2><p class="sub">Estimates for each stall. The stall can update them.</p>`;
  STALLS.forEach(s=>{const w=waitFor(s);h+=`<div class="row stall"><span><span class="dot" style="background:${col(w)}"></span>${s.name}<br><small style="color:var(--mute)">${w<=6?'Short queue':w<=12?'Moderate queue':'Long queue'}</small></span><span class="wait">~${w} min</span></div>`});
  const best=CROWD.indexOf(Math.min(...CROWD));
  h+=`</div><div class="card"><h2>Crowd through the break</h2><p class="sub">Typical queue size by time. Go at the yellow bar to avoid the rush.</p><div class="chart">${CROWD.map((c,i)=>`<div class="${i===idx()?'now':i===best?'best':''}" style="height:${c}%" title="${SLOTS[i]}"></div>`).join('')}</div><div class="lbls">${SLOTS.map(s=>`<span>${s}</span>`).join('')}</div></div>`;
  return h}

function renderFeed(){
  const f=S.fb,tags=['Long queues','No seats','Dirty tables','Wrong orders','Rude staff','Slow service'];
  return `<div class="card"><h2>Tell the school what to improve</h2><p class="sub">Your answers go into the survey results we share with the food court managers.</p>
  <div class="chips">${[1,2,3,4,5].map(n=>`<button class="chip" data-r="${n}" aria-pressed="${f.rate===n}">${n}★</button>`).join('')}</div>
  <p class="sub" style="margin:12px 0 6px">What went wrong today?</p><div class="chips">${tags.map(t=>`<button class="chip" data-g="${t}" aria-pressed="${f.tags.includes(t)}">${t}</button>`).join('')}</div>
  <p class="sub" style="margin:12px 0 6px">One change you’d recommend</p><textarea id="txt" placeholder="e.g. Hire more staff at 12:00">${esc(f.text)}</textarea>
  <button class="btn" style="margin-top:12px" id="send" ${S.sent?'disabled':''}>${S.sent?'Thanks – submitted':'Submit feedback'}</button></div>
  <div class="card"><h2>Survey results</h2><p class="sub">Biggest problems students report at the food court. Starts with our interview findings.</p>${surveyHTML()}</div>`}

function renderOOrders(){
  const act=Sync.d.orders.filter(o=>o.stall===S.stall&&!['collected','cancelled'].includes(o.status)).sort((a,b)=>(b.lane==='priority')-(a.lane==='priority')||a.t-b.t);
  const c=x=>act.filter(o=>o.status===x).length;
  let h=`<div class="cnt"><div><b>${c('new')}</b>New</div><div><b>${c('preparing')}</b>Preparing</div><div><b>${c('ready')}</b>Ready</div></div>`;
  if(!act.length)h+=`<div class="card empty">No orders for ${esc(stallOf().name)} yet. Paid orders appear here as soon as customers send them.</div>`;
  act.forEach(o=>{h+=`<div class="card oc ${o.lane==='priority'?'pri':''}"><div class="row"><h2 style="font-size:32px">#${esc(o.num)}${o.lane==='priority'?'<span class="tag pri">Priority</span>':''}</h2><span class="wait">${esc(o.slot)}</span></div>
   ${(o.items||[]).map(i=>`<div class="row" style="margin-top:4px"><span>${esc(i.q)} × ${esc(i.n)}</span></div>`).join('')}
   <div class="row" style="margin-top:10px"><b>${fmt(+o.total||0)}</b><span style="color:var(--mute)">${PAYL[o.pay]||'Not paid'}${o.method&&o.pay!=='unpaid'?' ('+ML[o.method]+')':''} · ${ST[o.status]?ST[o.status][0].replace('!',''):''}</span></div>
   ${o.pay!=='paid'?`<button class="btn ghost" style="margin-top:10px" data-pay="${esc(o.id)}">${o.pay==='claimed'?'Confirm payment received':'Mark as paid'}</button>`:''}<button class="btn" style="margin-top:10px" data-o="${esc(o.id)}">${NEXT[o.status][1]}</button></div>`});
  return h+syncNote()}

function renderOStalls(){
  const s=stallOf(),c=cfgOf(s),manual=c&&c.wait!=null,w=waitFor(s),q=pn();
  return `<div class="card"><h2>${s.name}: queue wait time</h2><p class="sub">Set the wait time customers see. Use the automatic estimate when you’re not sure.</p><div class="row"><span class="qty"><button aria-label="Less time" data-w="${s.id}" data-d="-1">−</button><b class="wait" style="min-width:64px;text-align:center;color:${col(w)}">~${w} min</b><button aria-label="More time" data-w="${s.id}" data-d="1">+</button></span>${manual?`<button class="chip" data-wr="${s.id}">Use automatic</button>`:'<small style="color:var(--mute)">Automatic estimate</small>'}</div></div>
<div class="card"><h2>PayNow payments</h2><p class="sub">Customers pay by scanning a PayNow QR with the exact amount and their order number. Check your banking app, then tap Confirm payment received on the order.</p>
<div class="chips"><button class="chip" data-pt="mobile" aria-pressed="${q.type==='mobile'}">Mobile number</button><button class="chip" data-pt="uen" aria-pressed="${q.type==='uen'}">Business UEN</button></div>
<label class="sub" for="pnid" style="display:block;margin:10px 0 6px">${q.type==='uen'?'UEN':'Mobile number (8 digits)'}</label><input id="pnid" ${INP} value="${esc(q.raw)}" autocomplete="off">
<label class="sub" for="pnname" style="display:block;margin:10px 0 6px">Stall name shown to customers</label><input id="pnname" ${INP} value="${esc(q.name)}" autocomplete="off">
<button class="btn" style="margin-top:12px" id="pnsave">Save PayNow details</button><p class="note">${payNowCfg(S.stall)?'PayNow is on for customers.':'PayNow is off until you save your details. Save with the box empty to turn it off.'}</p></div>
<div class="card"><h2>PayLah payments</h2><p class="sub">Customers see your PayLah mobile number, the amount and their order number. Check PayLah, then tap Confirm payment received on the order.</p><label class="sub" for="plid" style="display:block;margin:10px 0 6px">PayLah mobile number (8 digits)</label><input id="plid" ${INP} value="${esc(pl().raw)}" autocomplete="off"><button class="btn" style="margin-top:12px" id="plsave">Save PayLah details</button><p class="note">${payLahCfg(S.stall)?'PayLah is on for customers.':'PayLah is off until you save your number. Save with the box empty to turn it off.'}</p></div>`+syncNote()}
function renderPick(){return `<div class="card"><h2>Choose your stall</h2><p class="sub">Each stall only sees its own orders.</p>${STALLS.map(x=>`<a class="btn ghost" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="#owner-${x.id}">${x.name}</a>`).join('')}</div>`}

function renderOFeed(){
  const fb=Sync.d.fb,rated=fb.filter(f=>f.rate),avg=rated.length?(rated.reduce((a,f)=>a+f.rate,0)/rated.length).toFixed(1):'–';
  const cm=fb.filter(f=>f.text).sort((a,b)=>b.t-a.t).slice(0,12);
  return `<div class="cnt"><div><b>${avg}</b>Average rating</div><div><b>${fb.length}</b>Responses</div></div>
  <div class="card"><h2>Survey results</h2><p class="sub">What students say needs fixing.</p>${surveyHTML()}</div>
  <div class="card"><h2>Suggestions</h2>${cm.length?cm.map(f=>`<div class="cm">${f.rate?esc(f.rate)+'★ · ':''}${esc(f.text)}</div>`).join(''):'<p class="sub">No written suggestions yet.</p>'}</div>`}

const VIEWS={order:renderOrder,wait:renderWait,feed:renderFeed,oorders:renderOOrders,ostalls:renderOStalls,ofeed:renderOFeed};
function render(){
  const tabs=(S.mode==='owner'&&!S.stall)?[]:TABS[S.mode];if(tabs.length&&!tabs.some(t=>t[0]===S.tab))S.tab=tabs[0][0];
  $('#sub').textContent=S.mode==='owner'?(S.stall?stallOf().name+' · stall owner':'Stall owner'):'School food court';
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k===S.tab}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${l}</button>`).join('');
  const w=avgWait(),best=SLOTS[CROWD.indexOf(Math.min(...CROWD))];
  $('#hero').innerHTML=S.mode==='customer'?`<div class="hero"><div><div class="big">~${w} min</div><p>Average wait right now if you queue</p></div><div class="best">Quietest time to queue: ${best}</div></div>`:'';
  S.mine.forEach(id=>{const o=Sync.d.orders.find(x=>x.id===id);if(o&&S.seen[id]!==o.status){if(S.seen[id]&&o.status==='ready')toast('Order #'+o.num+' is ready!');S.seen[id]=o.status}});
  $('#v').innerHTML=(S.mode==='owner'&&S.locked)?'<div class="card empty">This page is for the store owner. Customers should use the customer link to order food.</div>':((S.mode==='owner'&&!S.stall)?renderPick():VIEWS[S.tab]());drawQR();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.disabled)return;const d=t.dataset;
  if(d.t){S.tab=d.t;scrollTo(0,0)}
  else if(d.mode){S.mode=d.mode;S.tab=TABS[S.mode][0][0]}
  else if(d.p)S.cart[d.p]=(S.cart[d.p]||0)+1;
  else if(d.m)S.cart[d.m]=Math.max(0,(S.cart[d.m]||0)-1);
  else if(d.s)S.slot=d.s;
  else if(d.l)S.lane=d.l;
  else if(d.b){S.breakMin=+d.b;store.set('break',S.breakMin);if(S.breakMin>30&&S.lane==='priority')S.lane='standard'}
  else if(d.place){const x=STALLS.find(y=>y.id===d.place),items=[];let total=0;x.items.forEach(it=>{const q=S.cart[it.n]||0;if(q){items.push({n:it.n,q});total+=q*it.p}});if(!items.length)return;
    S.pending={id:'o'+Date.now().toString(36)+Math.floor(Math.random()*99),num:String(100+Math.floor(Math.random()*900)),stall:x.id,stallName:x.name,items,total,lane:S.lane,slot:S.slot,t:Date.now()};scrollTo(0,0)}
  else if(t.id==='paid'){const q=S.pending;if(q){S.mine.push(q.id);store.set('mine',S.mine);STALLS.find(y=>y.id===q.stall).items.forEach(it=>delete S.cart[it.n]);S.sent=false;S.pending=null;Sync.put('orders',{...q,status:'new',pay:'claimed',method:methodOf(q)});toast('Payment received. Order #'+q.num+' sent to '+q.stallName+'.')}}
  else if(t.id==='backcart')S.pending=null;
  else if(d.got){const o=Sync.d.orders.find(x=>x.id===d.got);if(o)Sync.put('orders',{...o,status:'collected'})}
  else if(d.o){const o=Sync.d.orders.find(x=>x.id===d.o);if(o&&NEXT[o.status])Sync.put('orders',{...o,status:NEXT[o.status][0]})}
  else if(d.w){const s=STALLS.find(x=>x.id===d.w);Sync.put('cfg',{id:s.id,wait:Math.max(1,Math.min(60,waitFor(s)+ +d.d))})}
  else if(d.meth)S.method=d.meth;
  else if(d.pt)pn().type=d.pt;
  else if(d.pay){const o=Sync.d.orders.find(x=>x.id===d.pay);if(o)Sync.put('orders',{...o,pay:'paid'})}
  else if(t.id==='pnsave'){const q=pn();if(!q.raw.trim()){Sync.put('cfg',{id:'paynow-'+S.stall,proxy:null});toast('PayNow turned off.');return}let proxy='';if(q.type==='uen'){const u=q.raw.toUpperCase().trim();if(/^[A-Z0-9]{9,10}$/.test(u))proxy=u}else{let d=q.raw.replace(/\D/g,'');if(d.length===10&&d.startsWith('65'))d=d.slice(2);if(/^[89]\d{7}$/.test(d))proxy='+65'+d}
    if(!proxy){toast(q.type==='uen'?'Enter a 9 or 10 character UEN.':'Enter an 8-digit mobile number starting with 8 or 9.');return}Sync.put('cfg',{id:'paynow-'+S.stall,type:q.type,raw:q.raw,proxy,name:q.name.trim()});toast('PayNow details saved.')}
  else if(t.id==='plsave'){const r=pl().raw;if(!r.trim()){Sync.put('cfg',{id:'paylah-'+S.stall,number:null});toast('PayLah turned off.');return}let d=r.replace(/\D/g,'');if(d.length===10&&d.startsWith('65'))d=d.slice(2);if(!/^[89]\d{7}$/.test(d)){toast('Enter an 8-digit mobile number starting with 8 or 9.');return}Sync.put('cfg',{id:'paylah-'+S.stall,number:'+65'+d,raw:r});toast('PayLah details saved.')}
  else if(d.wr)Sync.put('cfg',{id:d.wr,wait:null});
  else if(d.r)S.fb.rate=+d.r;
  else if(d.g){const a=S.fb.tags,i=a.indexOf(d.g);i>=0?a.splice(i,1):a.push(d.g)}
  else if(t.id==='send'){const id='f'+Date.now().toString(36)+Math.floor(Math.random()*99);Sync.put('fb',{id,rate:S.fb.rate,tags:[...S.fb.tags],text:S.fb.text.trim(),t:Date.now()});S.fb={rate:0,tags:[],text:''};S.sent=true;toast('Feedback submitted.')}
  else return;
  render();
});
document.addEventListener('change',e=>{if(e.target.id==='pickup'&&e.target.value){S.slot=e.target.value;render()}});
document.addEventListener('input',e=>{const i=e.target.id;if(i==='txt')S.fb.text=e.target.value;else if(i==='pnid')pn().raw=e.target.value;else if(i==='plid')pl().raw=e.target.value;else if(i==='pnname')pn().name=e.target.value});
setInterval(()=>{STALLS.forEach(s=>S.jit[s.id]=Math.round((S.jit[s.id]||0)*.5+(Math.random()*4-2)));ping()},4000);
render();Sync.init();
</script>
</body>
</html>
